# Copy to ~/.backup-utility/config.yaml and chmod 600 it.
# ${VAR} is read from the environment, then from the "env" file beside this one.

destinations:
  offsite:
    type: s3
    bucket: my-backups
    region: eu-west-1
    prefix: db/
    # Without keys, the standard AWS credential chain is used.
    access_key: ${S3_ACCESS_KEY}
    secret_key: ${S3_SECRET_KEY}
    # For MinIO, Cloudflare R2, Backblaze B2, DigitalOcean Spaces and so on:
    # endpoint: https://minio.example.com

  nas:
    type: sftp
    host: nas.local
    # port: 22
    user: backup
    key_file: ~/.ssh/id_ed25519
    # key_passphrase: ${SSH_PASSPHRASE}
    # password: ${SFTP_PASSWORD}     # instead of key_file
    # known_hosts: ~/.ssh/known_hosts
    path: /backups

  legacy-ftp:
    type: ftp
    host: ftp.example.com
    # port: 21
    user: backup
    password: ${FTP_PASSWORD}
    tls: true                        # FTPS. Without it, everything travels unencrypted.
    path: /backups

  azure:
    type: azure
    container: backups               # must already exist
    prefix: db/
    connection_string: ${AZURE_CONNECTION_STRING}

notifications:
  slack:
    webhook_url: ${BU_SLACK_WEBHOOK}
    notify_on: [success, failure]

jobs:
  orders:
    type: postgresql
    host: db.example.com
    # port: 5432                     # defaults to the database's standard port
    name: orders
    user: backup
    password: ${ORDERS_PASSWORD}
    output_dir: /var/backups/orders  # relative paths are relative to this file
    compress: true
    # file_pattern: "{db}_{date}{ext}"
    schedule: "0 2 * * *"            # 2am daily: minute hour day-of-month month day-of-week
    destinations: [offsite, nas]
    retention:
      days: 30                       # keep anything newer than this...
      keep_last: 5                   # ...and always the newest 5

  shop:
    type: mysql
    host: localhost
    name: shop
    user: backup
    password: ${SHOP_PASSWORD}
    output_dir: /var/backups/shop
    compress: true
    schedule: "30 1 * * *"
    retention:
      keep_last: 7

  catalog:
    type: mongodb
    host: localhost
    name: catalog
    user: backup
    password: ${CATALOG_PASSWORD}
    auth_db: admin
    output_dir: /var/backups/catalog
    compress: true
    schedule: "0 */6 * * *"
    destinations: [azure]
    retention:
      days: 14

  documents:
    type: folder                     # no database tools needed
    paths:                           # each folder is stored under its own name in one .tar
      - ~/Documents
      - /srv/app/uploads
    exclude:                         # optional glob patterns
      - node_modules                 # no slash: matches that name at any depth
      - "*.tmp"
      - "cache/**"                   # with a slash: relative to each folder
    # name: documents                # used for {db} in file names; defaults to the job name
    output_dir: /var/backups/documents
    compress: true                   # .tar.gz instead of .tar
    schedule: "0 3 * * *"
    destinations: [offsite]
    retention:
      keep_last: 7
