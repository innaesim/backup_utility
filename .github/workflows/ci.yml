name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.os }}, Java ${{ matrix.java }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        java: ['17']
        include:
          - os: ubuntu-latest
            java: '21'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - run: mvn -B verify

  install-unix:
    name: Installer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Install
        run: ./install.sh --yes
      - name: Check the result
        run: |
          "$HOME/.local/bin/backup-utility" --version
          "$HOME/.local/bin/backup-utility" doctor
          "$HOME/.local/bin/backup-utility" schedule list
          test -f "$HOME/.backup-utility/config.example.yaml"
          ls -l "$HOME/.backup-utility/config.yaml" | grep -q '^-rw-------'
          ls -l "$HOME/.backup-utility/env" | grep -q '^-rw-------'
      - name: Re-running keeps the existing config
        run: |
          echo '# my settings' >> "$HOME/.backup-utility/config.yaml"
          ./install.sh --yes
          grep -q '# my settings' "$HOME/.backup-utility/config.yaml"
      - name: Uninstall keeps the config
        run: |
          ./install.sh --uninstall
          test ! -e "$HOME/.local/bin/backup-utility"
          grep -q '# my settings' "$HOME/.backup-utility/config.yaml"

  install-windows:
    name: Installer (windows-latest)
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Install
        run: .\install.ps1 -Yes
      - name: Check the result
        run: |
          $launcher = Join-Path $env:LOCALAPPDATA 'backup-utility\bin\backup-utility.cmd'
          foreach ($arguments in '--version', 'doctor', 'schedule list') {
            cmd.exe /c "`"$launcher`" $arguments"
            if ($LASTEXITCODE -ne 0) { throw "'$arguments' failed with exit code $LASTEXITCODE" }
          }
          if (-not (Test-Path "$HOME\.backup-utility\config.example.yaml")) { throw 'config.example.yaml is missing' }
      - name: Re-running keeps the existing config
        run: |
          Add-Content "$HOME\.backup-utility\config.yaml" '# my settings'
          .\install.ps1 -Yes
          if (-not (Select-String -Quiet '# my settings' "$HOME\.backup-utility\config.yaml")) { throw 'the config was overwritten' }
      - name: Uninstall keeps the config
        run: |
          .\install.ps1 -Uninstall
          if (Test-Path (Join-Path $env:LOCALAPPDATA 'backup-utility\bin\backup-utility.cmd')) { throw 'the launcher is still there' }
          if (-not (Select-String -Quiet '# my settings' "$HOME\.backup-utility\config.yaml")) { throw 'the config was removed' }
